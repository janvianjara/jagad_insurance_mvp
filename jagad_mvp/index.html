<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Jagad Insurance agency platform" />

    <!--
      IBM Plex Sans carries the interface, IBM Plex Mono every id, amount and
      tabular date, Source Serif 4 only the generated documents (plan §2).
      Each face declares a real fallback stack in src/styles/tokens.css, so the
      product stays legible if the font host is unreachable.

      The sheet is fetched with media="print" and promoted to "all" once it
      lands. A plain stylesheet link here is render-blocking AND script-blocking
      — it sits above the module script, so the browser will not run a line of
      the application until a third-party host answers. Measured cold, that was
      1.6 seconds before React started. The fallback stacks in tokens.css are
      what make deferring it safe: text is legible from the first paint and the
      web faces swap in when they arrive (the URL already carries display=swap).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      />
    </noscript>

    <title>Jagad Insurance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
